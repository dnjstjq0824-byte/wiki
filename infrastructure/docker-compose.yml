services:
  postgres:
    image: postgres:16-alpine
    container_name: treewiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: treewiki_admin
      POSTGRES_PASSWORD: treewiki_dev_secret_password
      POSTGRES_DB: treewiki_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treewiki_admin -d treewiki_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: treewiki-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: treewiki-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: treewiki_minio_user
      MINIO_ROOT_PASSWORD: treewiki_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: treewiki-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: treewiki_meili_master_key_12345
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: treewiki-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_URL: postgres://treewiki_admin:treewiki_dev_secret_password@postgres:5432/treewiki_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-treewiki_jwt_super_secure_secret_key_change_in_production_2026}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: treewiki-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
      NUXT_API_BASE_INTERNAL: http://gateway:8080/api/v1
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:
  uploads_data:

