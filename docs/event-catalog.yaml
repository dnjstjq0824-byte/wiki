version: "1.0"
platform: "Treewiki"
description: "Event-Driven Architecture and Audit Message Catalog"

events:
  - name: "treewiki.page.created"
    description: "Published when a new wiki page is authored in any namespace"
    producer: "WikiCoreService"
    payload:
      page_id: "UUID"
      namespace_id: "int"
      title: "string"
      slug: "string"
      author_id: "UUID?"
      author_ip: "string"
      revision_id: "UUID"
      byte_length: "int"
      created_at: "ISO8601"

  - name: "treewiki.page.updated"
    description: "Published when an existing page receives a new revision"
    producer: "WikiCoreService"
    payload:
      page_id: "UUID"
      namespace_id: "int"
      title: "string"
      revision_id: "UUID"
      parent_revision_id: "UUID"
      author_id: "UUID?"
      author_ip: "string"
      summary: "string"
      byte_delta: "int"
      is_minor: "boolean"
      is_rollback: "boolean"
      created_at: "ISO8601"

  - name: "treewiki.page.moved"
    description: "Published when a page is renamed/moved to a new title and redirect created"
    producer: "WikiCoreService"
    payload:
      page_id: "UUID"
      old_title: "string"
      new_title: "string"
      leave_redirect: "boolean"
      actor_id: "UUID"
      reason: "string"

  - name: "treewiki.page.protected"
    description: "Published when page protection level is modified by a Sysop"
    producer: "GovernanceService"
    payload:
      page_id: "UUID"
      title: "string"
      protection_level: "string (all, autoconfirmed_only, editor_only, sysop_only)"
      expiry_at: "ISO8601?"
      sysop_id: "UUID"
      reason: "string"

  - name: "treewiki.revision.reverted"
    description: "Published when a rollback or manual undo is performed"
    producer: "RevisionService"
    payload:
      page_id: "UUID"
      reverted_revision_id: "UUID"
      restored_revision_id: "UUID"
      actor_id: "UUID"
      is_fast_rollback: "boolean"

  - name: "treewiki.revision.suppressed"
    description: "Published when a revision is hidden from public view by an Oversight officer"
    producer: "OversightService"
    payload:
      page_id: "UUID"
      revision_id: "UUID"
      suppression_scope: "string (comment, text, author, all)"
      officer_id: "UUID"
      legal_case_id: "string"
      reason: "string"

  - name: "treewiki.talk.thread_created"
    description: "Published when a new discussion topic is initiated on a talk page"
    producer: "DiscussionService"
    payload:
      thread_id: "UUID"
      page_id: "UUID"
      title: "string"
      author_id: "UUID?"
      content: "string"

  - name: "treewiki.talk.reply_added"
    description: "Published when a reply comment is appended to a talk thread"
    producer: "DiscussionService"
    payload:
      reply_id: "UUID"
      thread_id: "UUID"
      author_id: "UUID?"
      content: "string"

  - name: "treewiki.topic_tree.node_linked"
    description: "Published when an article is attached to a topic taxonomy node"
    producer: "TopicTreeService"
    payload:
      node_id: "UUID"
      page_id: "UUID"
      relationship_type: "string (prerequisite, subtopic, application, example)"
      weight: "float"

  - name: "treewiki.abuse_filter.triggered"
    description: "Published when an edit matches an active counter-vandalism regex/pattern rule"
    producer: "AbuseFilterService"
    payload:
      filter_id: "UUID"
      filter_name: "string"
      action_taken: "string (tag, warn, disallow, block)"
      actor_ip: "string"
      actor_id: "UUID?"
      matched_content: "string (truncated)"

