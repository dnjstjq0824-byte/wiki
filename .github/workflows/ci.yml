name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go build, vet, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treewiki_admin
          POSTGRES_PASSWORD: treewiki_test_password
          POSTGRES_DB: treewiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treewiki_admin -d treewiki_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l services pkg)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests (memory mode)
        run: go test ./...
      - name: postgres integration tests
        env:
          TREEWIKI_TEST_DATABASE_URL: postgres://treewiki_admin:treewiki_test_password@localhost:5432/treewiki_test?sslmode=disable
        run: go test ./pkg/pg/ ./services/wiki/ ./services/talk/ ./services/topictree/ ./services/watchlist/ ./services/governance/ ./services/search/ ./services/identity/ -count=1

  frontend:
    name: Nuxt typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @treewiki/web exec nuxt typecheck
      - run: pnpm --filter @treewiki/web build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --only-shell
      - name: build gateway
        run: go build -o /tmp/treewiki-gateway ./services/gateway/cmd
      - name: build web (node-server)
        env:
          NITRO_PRESET: node-server
        run: pnpm --filter @treewiki/web build
      - name: run E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TREEWIKI_GATEWAY_URL: http://localhost:8080
          NUXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          PORT=8080 CORS_ALLOWED_ORIGINS=http://localhost:3000 /tmp/treewiki-gateway &
          GW_PID=$!
          PORT=3000 node apps/web/.output/server/index.mjs &
          WEB_PID=$!
          trap "kill $GW_PID $WEB_PID" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && curl -sf http://localhost:3000/ -o /dev/null && break
            sleep 2
          done
          pnpm test:e2e
